[project]
name = "goit-algo-fp"
version = "0.1.0"
description = "Algorithms and Data Structures Final Project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "networkx",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []
